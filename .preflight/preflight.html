<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preflight</title>
    <style id="theme-vars">
/* companion-play-app design tokens */

:root {
  /* Primary brand: bright yellow */
  --companion-primary-50: #fffde6;
  --companion-primary-100: #fff9c4;
  --companion-primary-200: #fff59d;
  --companion-primary-300: #fff176;
  --companion-primary-400: #ffee58;
  --companion-primary-500: #ffe135;
  --companion-primary-600: #ffd60a;
  --companion-primary-700: #ffcc00;

  /* Category accent colors (explicit user request for high-saturation multi-category palette) */
  --companion-purple: #a855f7;
  --companion-purple-soft: #f3e8ff;
  --companion-blue: #0ea5e9;
  --companion-blue-soft: #e0f2fe;
  --companion-pink: #f472b6;
  --companion-pink-soft: #fce7f3;

  /* Neutral scale */
  --companion-neutral-0: #ffffff;
  --companion-neutral-50: #fafafa;
  --companion-neutral-100: #f5f5f5;
  --companion-neutral-200: #e5e5e5;
  --companion-neutral-300: #d4d4d4;
  --companion-neutral-400: #a3a3a3;
  --companion-neutral-500: #737373;
  --companion-neutral-600: #525252;
  --companion-neutral-700: #404040;
  --companion-neutral-800: #262626;
  --companion-neutral-900: #171717;

  /* Semantic tokens */
  --companion-background: #fffbeb;
  --companion-foreground: #171717;
  --companion-card: #ffffff;
  --companion-card-foreground: #171717;
  --companion-popover: #ffffff;
  --companion-popover-foreground: #171717;
  --companion-primary: #ffd60a;
  --companion-primary-foreground: #171717;
  --companion-muted: #f5f5f5;
  --companion-muted-foreground: #737373;
  --companion-border: #e5e5e5;
  --companion-input: #e5e5e5;
  --companion-ring: #ffd60a;

  /* State colors */
  --companion-state-success: #22c55e;
  --companion-state-warning: #f59e0b;
  --companion-state-error: #ef4444;
  --companion-state-info: #0ea5e9;

  /* Radius scale */
  --companion-radius-small: 4px;
  --companion-radius-medium: 8px;
  --companion-radius-large: 16px;
  --companion-radius-full: 9999px;

  /* Shadows */
  --companion-shadow-1: 0 1px 2px rgba(23, 23, 23, 0.05), 0 1px 1px rgba(23, 23, 23, 0.03);
  --companion-shadow-2: 0 8px 24px -8px rgba(23, 23, 23, 0.18);
  --companion-shadow-3: 0 24px 60px -20px rgba(23, 23, 23, 0.30);

  /* Typography */
  --companion-font-display: 'Inter', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
  --companion-font-body: 'Inter', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
}

/* Light theme class */
.light {
  --companion-background: #fffbeb;
  --companion-foreground: #171717;
  --companion-card: #ffffff;
  --companion-card-foreground: #171717;
  --companion-popover: #ffffff;
  --companion-popover-foreground: #171717;
  --companion-primary: #ffd60a;
  --companion-primary-foreground: #171717;
  --companion-muted: #f5f5f5;
  --companion-muted-foreground: #737373;
  --companion-border: #e5e5e5;
  --companion-input: #e5e5e5;
  --companion-ring: #ffd60a;
}

/* Dark theme class */
.dark {
  --companion-background: #0f0f12;
  --companion-foreground: #f5f5f5;
  --companion-card: #1c1c21;
  --companion-card-foreground: #f5f5f5;
  --companion-popover: #1c1c21;
  --companion-popover-foreground: #f5f5f5;
  --companion-primary: #ffd60a;
  --companion-primary-foreground: #171717;
  --companion-muted: #262626;
  --companion-muted-foreground: #a3a3a3;
  --companion-border: #2e2e33;
  --companion-input: #2e2e33;
  --companion-ring: #ffd60a;
}

/* Typography utilities */
.font-display {
  font-family: var(--companion-font-display);
}
.font-body {
  font-family: var(--companion-font-body);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--companion-background);
    --color-foreground: var(--companion-foreground);
    --color-card: var(--companion-card);
    --color-card-foreground: var(--companion-card-foreground);
    --color-popover: var(--companion-popover);
    --color-popover-foreground: var(--companion-popover-foreground);
    --color-primary: var(--companion-primary);
    --color-primary-foreground: var(--companion-primary-foreground);
    --color-muted: var(--companion-muted);
    --color-muted-foreground: var(--companion-muted-foreground);
    --color-border: var(--companion-border);
    --color-input: var(--companion-input);
    --color-ring: var(--companion-ring);
    --radius-sm: var(--companion-radius-small);
    --radius-md: var(--companion-radius-medium);
    --radius-lg: var(--companion-radius-large);
  }
  @layer base {
    body { background: var(--companion-background); color: var(--companion-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>

    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
