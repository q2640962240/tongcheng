<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首页</title>
    <style id="theme-vars">
/* companion-play-app design tokens */

:root {
  /* Primary brand: bright yellow */
  --companion-primary-50: #fffde6;
  --companion-primary-100: #fff9c4;
  --companion-primary-200: #fff59d;
  --companion-primary-300: #fff176;
  --companion-primary-400: #ffee58;
  --companion-primary-500: #ffe135;
  --companion-primary-600: #ffd60a;
  --companion-primary-700: #ffcc00;

  /* Category accent colors (explicit user request for high-saturation multi-category palette) */
  --companion-purple: #a855f7;
  --companion-purple-soft: #f3e8ff;
  --companion-blue: #0ea5e9;
  --companion-blue-soft: #e0f2fe;
  --companion-pink: #f472b6;
  --companion-pink-soft: #fce7f3;

  /* Neutral scale */
  --companion-neutral-0: #ffffff;
  --companion-neutral-50: #fafafa;
  --companion-neutral-100: #f5f5f5;
  --companion-neutral-200: #e5e5e5;
  --companion-neutral-300: #d4d4d4;
  --companion-neutral-400: #a3a3a3;
  --companion-neutral-500: #737373;
  --companion-neutral-600: #525252;
  --companion-neutral-700: #404040;
  --companion-neutral-800: #262626;
  --companion-neutral-900: #171717;

  /* Semantic tokens */
  --companion-background: #fffbeb;
  --companion-foreground: #171717;
  --companion-card: #ffffff;
  --companion-card-foreground: #171717;
  --companion-popover: #ffffff;
  --companion-popover-foreground: #171717;
  --companion-primary: #ffd60a;
  --companion-primary-foreground: #171717;
  --companion-muted: #f5f5f5;
  --companion-muted-foreground: #737373;
  --companion-border: #e5e5e5;
  --companion-input: #e5e5e5;
  --companion-ring: #ffd60a;

  /* State colors */
  --companion-state-success: #22c55e;
  --companion-state-warning: #f59e0b;
  --companion-state-error: #ef4444;
  --companion-state-info: #0ea5e9;

  /* Radius scale */
  --companion-radius-small: 4px;
  --companion-radius-medium: 8px;
  --companion-radius-large: 16px;
  --companion-radius-full: 9999px;

  /* Shadows */
  --companion-shadow-1: 0 1px 2px rgba(23, 23, 23, 0.05), 0 1px 1px rgba(23, 23, 23, 0.03);
  --companion-shadow-2: 0 8px 24px -8px rgba(23, 23, 23, 0.18);
  --companion-shadow-3: 0 24px 60px -20px rgba(23, 23, 23, 0.30);

  /* Typography */
  --companion-font-display: 'Inter', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
  --companion-font-body: 'Inter', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
}

/* Light theme class */
.light {
  --companion-background: #fffbeb;
  --companion-foreground: #171717;
  --companion-card: #ffffff;
  --companion-card-foreground: #171717;
  --companion-popover: #ffffff;
  --companion-popover-foreground: #171717;
  --companion-primary: #ffd60a;
  --companion-primary-foreground: #171717;
  --companion-muted: #f5f5f5;
  --companion-muted-foreground: #737373;
  --companion-border: #e5e5e5;
  --companion-input: #e5e5e5;
  --companion-ring: #ffd60a;
}

/* Dark theme class */
.dark {
  --companion-background: #0f0f12;
  --companion-foreground: #f5f5f5;
  --companion-card: #1c1c21;
  --companion-card-foreground: #f5f5f5;
  --companion-popover: #1c1c21;
  --companion-popover-foreground: #f5f5f5;
  --companion-primary: #ffd60a;
  --companion-primary-foreground: #171717;
  --companion-muted: #262626;
  --companion-muted-foreground: #a3a3a3;
  --companion-border: #2e2e33;
  --companion-input: #2e2e33;
  --companion-ring: #ffd60a;
}

/* Typography utilities */
.font-display {
  font-family: var(--companion-font-display);
}
.font-body {
  font-family: var(--companion-font-body);
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--companion-background);
    --color-foreground: var(--companion-foreground);
    --color-card: var(--companion-card);
    --color-card-foreground: var(--companion-card-foreground);
    --color-popover: var(--companion-popover);
    --color-popover-foreground: var(--companion-popover-foreground);
    --color-primary: var(--companion-primary);
    --color-primary-foreground: var(--companion-primary-foreground);
    --color-muted: var(--companion-muted);
    --color-muted-foreground: var(--companion-muted-foreground);
    --color-border: var(--companion-border);
    --color-input: var(--companion-input);
    --color-ring: var(--companion-ring);
    --radius-sm: var(--companion-radius-small);
    --radius-md: var(--companion-radius-medium);
    --radius-lg: var(--companion-radius-large);
  }
  @layer base {
    body { background: var(--companion-background); color: var(--companion-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>

      .ring-popover { --tw-ring-color: var(--companion-popover); }
      .bg-popover-foreground { background-color: var(--companion-popover-foreground); }
      .text-popover-foreground { color: var(--companion-popover-foreground); }
      .border-popover-foreground { border-color: var(--companion-popover-foreground); }
      .ring-popover-foreground { --tw-ring-color: var(--companion-popover-foreground); }
      .bg-primary { background-color: var(--companion-primary); }
      .text-primary { color: var(--companion-primary); }
      .border-primary { border-color: var(--companion-primary); }
      .ring-primary { --tw-ring-color: var(--companion-primary); }
      .bg-primary-foreground { background-color: var(--companion-primary-foreground); }
      .text-primary-foreground { color: var(--companion-primary-foreground); }
      .border-primary-foreground { border-color: var(--companion-primary-foreground); }
      .ring-primary-foreground { --tw-ring-color: var(--companion-primary-foreground); }
      .bg-muted { background-color: var(--companion-muted); }

      .border-muted { border-color: var(--companion-muted); }
      .ring-muted { --tw-ring-color: var(--companion-muted); }
      .bg-muted-foreground { background-color: var(--companion-muted-foreground); }
      .text-muted-foreground { color: var(--companion-muted-foreground); }
      .border-muted-foreground { border-color: var(--companion-muted-foreground); }
      .ring-muted-foreground { --tw-ring-color: var(--companion-muted-foreground); }
      .bg-border { background-color: var(--companion-border); }

      .bg-input { background-color: var(--companion-input); }

      .ring-ring { --tw-ring-color: var(--companion-ring); }

    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;

        mask-position: center;
        background-color: currentColor;

</head>
<body class="min-h-screen font-sans antialiased">
    <div class="max-w-md mx-auto min-h-screen flex flex-col pb-[56px]">
        <!-- Sticky header -->
        <header class="sticky top-0 z-40 bg-card/95 backdrop-blur border-b border-border px-4 h-14 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-primary flex items-center justify-center text-primary-foreground font-bold text-sm">伴</div>
                <span class="font-display font-bold text-lg text-foreground">白夜</span>
            </div>
            <div class="flex items-center gap-1">
                <button type="button" aria-label="搜索" class="w-10 h-10 rounded-full hover:bg-muted flex items-center justify-center text-foreground transition-colors">
                    <i data-lucide="search" class="w-5 h-5"></i>
                </button>
                <button type="button" aria-label="消息" class="relative w-10 h-10 rounded-full hover:bg-muted flex items-center justify-center text-foreground transition-colors">
                    <i data-lucide="message-circle" class="w-5 h-5"></i>
                    <span class="absolute top-2 right-2 w-2 h-2 rounded-full bg-pink-500 border-2 border-card"></span>
                </button>
            </div>
        </header>

        <!-- Main scrollable content -->
        <main class="flex-1 px-4 py-3 space-y-4">
            <!-- Category chips -->
            <section aria-label="分类" class="no-scrollbar -mx-4 px-4 overflow-x-auto">
                <div class="flex gap-2 w-max">
                    <button type="button" class="px-3.5 py-1.5 rounded-full bg-primary text-primary-foreground text-sm font-medium whitespace-nowrap shadow-sm">兴趣约玩·运动健身</button>
                    <button type="button" class="px-3.5 py-1.5 rounded-full bg-card border border-border text-foreground text-sm font-medium whitespace-nowrap shadow-sm">游戏陪玩</button>
                    <button type="button" class="px-3.5 py-1.5 rounded-full bg-card border border-border text-foreground text-sm font-medium whitespace-nowrap shadow-sm">暖心陪伴</button>
                    <button type="button" class="px-3.5 py-1.5 rounded-full bg-card border border-border text-foreground text-sm font-medium whitespace-nowrap shadow-sm">唱歌</button>
                    <button type="button" class="px-3.5 py-1.5 rounded-full bg-card border border-border text-foreground text-sm font-medium whitespace-nowrap shadow-sm">哄睡叫醒</button>
                </div>
            </section>

            <!-- Recommendation feed -->
            <section aria-label="推荐" class="space-y-3">
                <h2 class="font-display font-semibold text-base text-foreground">为你推荐</h2>

                <a id="card-warm-services" data-dom-id="card-warm-services" href="pages/warm-services.html" class="flex gap-3 bg-card rounded-2xl p-3 border border-border shadow-sm active:scale-[0.99] transition-transform">
                    <img src="../assets/avatar-provider-01.jpg" alt="小暖" class="w-16 h-16 rounded-2xl object-cover shrink-0 bg-muted">
                    <div class="flex-1 min-w-0 flex flex-col justify-between py-0.5">
                        <div class="flex items-center gap-2 flex-wrap">
                            <span class="font-semibold text-foreground truncate">小暖</span>
                            <span class="px-2 py-0.5 rounded-full text-[11px] font-medium whitespace-nowrap" style="background-color: var(--companion-pink-soft); color: var(--companion-pink);">暖心陪伴</span>
                            <span class="px-2 py-0.5 rounded-full text-[11px] font-medium whitespace-nowrap" style="background-color: var(--companion-purple-soft); color: var(--companion-purple);">情绪树洞</span>
                        </div>
                        <p class="text-sm text-muted-foreground truncate">温柔倾听，陪你度过每一个需要安慰的夜晚。</p>
                    </div>
                    <span class="self-center shrink-0 px-3 py-1.5 rounded-full bg-primary text-primary-foreground text-sm font-semibold whitespace-nowrap shadow-sm">联系TA</span>
                </a>

                <a id="card-game-services" data-dom-id="card-game-services" href="pages/game-services.html" class="flex gap-3 bg-card rounded-2xl p-3 border border-border shadow-sm active:scale-[0.99] transition-transform">
                    <img src="../assets/avatar-provider-02.jpg" alt="电竞阿杰" class="w-16 h-16 rounded-2xl object-cover shrink-0 bg-muted">
                    <div class="flex-1 min-w-0 flex flex-col justify-between py-0.5">
                        <div class="flex items-center gap-2 flex-wrap">
                            <span class="font-semibold text-foreground truncate">电竞阿杰</span>
                            <span class="px-2 py-0.5 rounded-full text-[11px] font-medium whitespace-nowrap" style="background-color: var(--companion-blue-soft); color: var(--companion-blue);">游戏陪玩</span>
                            <span class="px-2 py-0.5 rounded-full text-[11px] font-medium whitespace-nowrap" style="background-color: var(--companion-purple-soft); color: var(--companion-purple);">王者</span>
                        </div>
                        <p class="text-sm text-muted-foreground truncate">峡谷不孤单，带你上分稳如老狗。</p>
                    </div>
                    <span class="self-center shrink-0 px-3 py-1.5 rounded-full bg-primary text-primary-foreground text-sm font-semibold whitespace-nowrap shadow-sm">联系TA</span>
                </a>

                <a id="card-offline-play" data-dom-id="card-offline-play" href="pages/offline-play.html" class="flex gap-3 bg-card rounded-2xl p-3 border border-border shadow-sm active:scale-[0.99] transition-transform">
                    <img src="../assets/avatar-provider-01.jpg" alt="运动达人小林" class="w-16 h-16 rounded-2xl object-cover shrink-0 bg-muted">
                    <div class="flex-1 min-w-0 flex flex-col justify-between py-0.5">
                        <div class="flex items-center gap-2 flex-wrap">
                            <span class="font-semibold text-foreground truncate">运动达人小林</span>
                            <span class="px-2 py-0.5 rounded-full text-[11px] font-medium whitespace-nowrap" style="background-color: var(--companion-pink-soft); color: var(--companion-pink);">兴趣约玩</span>
                            <span class="px-2 py-0.5 rounded-full text-[11px] font-medium whitespace-nowrap" style="background-color: var(--companion-blue-soft); color: var(--companion-blue);">运动健身</span>
                        </div>
                        <p class="text-sm text-muted-foreground truncate">周末羽毛球、骑行、徒步，一起流汗更快乐。</p>
                    </div>
                    <span class="self-center shrink-0 px-3 py-1.5 rounded-full bg-primary text-primary-foreground text-sm font-semibold whitespace-nowrap shadow-sm">联系TA</span>
                </a>

                <a href="#" class="flex gap-3 bg-card rounded-2xl p-3 border border-border shadow-sm active:scale-[0.99] transition-transform">
                    <img src="../assets/avatar-provider-02.jpg" alt="甜甜" class="w-16 h-16 rounded-2xl object-cover shrink-0 bg-muted">
                    <div class="flex-1 min-w-0 flex flex-col justify-between py-0.5">
                        <div class="flex items-center gap-2 flex-wrap">
                            <span class="font-semibold text-foreground truncate">甜甜</span>
                            <span class="px-2 py-0.5 rounded-full text-[11px] font-medium whitespace-nowrap" style="background-color: var(--companion-purple-soft); color: var(--companion-purple);">唱歌</span>
                            <span class="px-2 py-0.5 rounded-full text-[11px] font-medium whitespace-nowrap" style="background-color: var(--companion-pink-soft); color: var(--companion-pink);">哄睡叫醒</span>
                        </div>
                        <p class="text-sm text-muted-foreground truncate">用声音陪你入眠，清晨温柔叫醒。</p>
                    </div>
                    <span class="self-center shrink-0 px-3 py-1.5 rounded-full bg-primary text-primary-foreground text-sm font-semibold whitespace-nowrap shadow-sm">联系TA</span>
                </a>

                <a href="#" class="flex gap-3 bg-card rounded-2xl p-3 border border-border shadow-sm active:scale-[0.99] transition-transform">
                    <img src="../assets/avatar-provider-01.jpg" alt="猫咪酱" class="w-16 h-16 rounded-2xl object-cover shrink-0 bg-muted">
                    <div class="flex-1 min-w-0 flex flex-col justify-between py-0.5">
                        <div class="flex items-center gap-2 flex-wrap">
                            <span class="font-semibold text-foreground truncate">猫咪酱</span>
                            <span class="px-2 py-0.5 rounded-full text-[11px] font-medium whitespace-nowrap" style="background-color: var(--companion-blue-soft); color: var(--companion-blue);">哄睡叫醒</span>
                            <span class="px-2 py-0.5 rounded-full text-[11px] font-medium whitespace-nowrap" style="background-color: var(--companion-pink-soft); color: var(--companion-pink);">语音连麦</span>
                        </div>
                        <p class="text-sm text-muted-foreground truncate">软萌声线，深夜专属陪伴。</p>
                    </div>
                    <span class="self-center shrink-0 px-3 py-1.5 rounded-full bg-primary text-primary-foreground text-sm font-semibold whitespace-nowrap shadow-sm">联系TA</span>
                </a>
            </section>
        </main>
    </div>

    <!-- Mobile bottom navigation -->
    <nav data-mobile-nav="global" class="w-full bg-card border-t border-border">
        <div class="w-full max-w-md mx-auto grid grid-cols-3 h-[56px]">
            <a href="#" data-nav-key="home" data-active="true" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-primary font-medium" data-dom-id="nav-home"><i data-lucide="home" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">首页</span></a>
            <a href="#" id="nav-discover" data-dom-id="nav-discover" data-nav-key="discover" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-muted-foreground" data-dom-id="nav-discover"><i data-lucide="compass" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">发现</span></a>
            <a href="#" id="nav-profile" data-dom-id="nav-profile" data-nav-key="profile" class="min-w-0 flex flex-col items-center justify-center gap-0.5 px-1 h-full text-muted-foreground" data-dom-id="nav-profile"><i data-lucide="user" class="w-5 h-5 shrink-0"></i><span class="text-[11px] leading-none whitespace-nowrap max-w-full truncate">我的</span></a>

    <script>lucide.createIcons();</script>
