name: baiye

services:
  mysql:
    image: mysql:8.0
    container_name: baiye-mysql
    restart: always
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-Baiye@2024!}"
      MYSQL_DATABASE: companion_play
    command: ["--character-set-server=utf8mb4","--collation-server=utf8mb4_unicode_ci","--innodb-buffer-pool-size=268435456","--max-connections=80","--skip-name-resolve","--default-authentication-plugin=mysql_native_password"]
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD","mysqladmin","ping","-uroot","-p${MYSQL_ROOT_PASSWORD:-Baiye@2024!}","-h","127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [back]

  redis:
    image: redis:7-alpine
    container_name: baiye-redis
    restart: always
    environment:
      TZ: Asia/Shanghai
    command: ["redis-server","--maxmemory","64mb","--maxmemory-policy","allkeys-lru","--appendonly","yes","--save","","--requirepass","${REDIS_PASSWORD:-BaiyeRedis2026!}"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD","redis-cli","-a","${REDIS_PASSWORD:-BaiyeRedis2026!}","ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [back]

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: baiye-server
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      # 容器启动时是否执行 src/seed.js。默认 false：每次部署都会重建本容器，
      # 若默认执行等于每次部署都在改生产数据（2026-09-07 曾因此多出 14 行礼物）。
      # 建表不依赖它 —— app.js 启动时会自己调 db.bootstrap()（alter 模式）。
      # 首次部署 / 需要同步种子数据时，在 .env 里设 SEED_ON_BOOT=true 再启动一次。
      SEED_ON_BOOT: "${SEED_ON_BOOT:-false}"
      DB_DRIVER: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: companion_play
      DB_USER: root
      DB_PASSWORD: "${MYSQL_ROOT_PASSWORD:-Baiye@2024!}"
      DB_LOGGING: "false"
      DB_POOL_MAX: 12
      DB_POOL_MIN: 2
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:-BaiyeRedis2026!}"
      # ⚠️ 三个密钥都不给 fallback 默认值：必须来自 /opt/baiye/.env。
      # 旧值曾以 `${JWT_SECRET:-<明文>}` 的形式写在这里并随 public 仓库发布，
      # 2026-09-08 实测能用它伪造任意用户的登录令牌（AGENTS.md 坑点 33）。
      # 缺失时 server/src/config/index.js 的 assertProdSecrets() 会让容器 crash-loop
      # 并打印修法 —— 这是刻意的：静默退化成 'dev_secret' 比崩溃危险得多。
      JWT_SECRET: "${JWT_SECRET:?必须在 .env 设置}"
      JWT_EXPIRES_IN: 7d
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?必须在 .env 设置}"
      JWT_REFRESH_EXPIRES_IN: 30d
      # 管理后台令牌用独立密钥，不复用也不派生自 JWT_SECRET（派生值可被算出来）
      ADMIN_JWT_SECRET: "${ADMIN_JWT_SECRET:?必须在 .env 设置}"
      APP_NAME: "白夜"
      APP_DOMAIN: "${APP_DOMAIN:-https://zyb001.cn}"
      CORS_ORIGINS: "${CORS_ORIGINS:-*}"
    volumes:
      - server-uploads:/app/uploads
      - server-data:/app/data
      - server-logs:/app/logs
    expose:
      - "3000"
    networks: [back, front]
    healthcheck:
      test: ["CMD","node","/usr/local/bin/healthcheck.js"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: baiye-admin
    restart: always
    depends_on:
      server:
        condition: service_healthy
    expose:
      - "80"
    networks: [front]

  h5:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: baiye-h5
    restart: always
    depends_on:
      server:
        condition: service_healthy
    expose:
      - "80"
    networks: [front]

  gateway:
    image: nginx:1.27-alpine
    container_name: baiye-gateway
    restart: always
    depends_on:
      server:
        condition: service_healthy
      admin:
        condition: service_started
      h5:
        condition: service_started
    environment:
      TZ: Asia/Shanghai
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx-docker.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/certbot/etc/letsencrypt:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
      - gateway-logs:/var/log/nginx
    networks: [front]
    healthcheck:
      test: ["CMD-SHELL","wget --no-check-certificate -qO- https://127.0.0.1/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  mysql-data:
  redis-data:
  server-uploads:
  server-data:
  server-logs:
  gateway-logs:

networks:
  back:
    driver: bridge
  front:
    driver: bridge
