name: baiye

services:
  mysql:
    image: mysql:8.0
    container_name: baiye-mysql
    restart: always
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Baiye@2026Root!}
      MYSQL_DATABASE: companion_play
    command: ["--character-set-server=utf8mb4","--collation-server=utf8mb4_unicode_ci","--innodb-buffer-pool-size=268435456","--max-connections=80","--skip-name-resolve","--default-authentication-plugin=mysql_native_password"]
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD","mysqladmin","ping","-uroot","-p${MYSQL_ROOT_PASSWORD:-Baiye@2026Root!}","-h","127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks: [back]

  redis:
    image: redis:7-alpine
    container_name: baiye-redis
    restart: always
    environment:
      TZ: Asia/Shanghai
    command: ["redis-server","--maxmemory","64mb","--maxmemory-policy","allkeys-lru","--appendonly","yes","--save","","--requirepass","${REDIS_PASSWORD:-BaiyeRedis2026!}"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD","redis-cli","-a","${REDIS_PASSWORD:-BaiyeRedis2026!}","ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [back]

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: baiye-server
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production
      PORT: 3000
      DB_DRIVER: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: companion_play
      DB_USER: root
      DB_PASSWORD: "${MYSQL_ROOT_PASSWORD:-Baiye@2026Root!}"
      DB_LOGGING: "false"
      DB_POOL_MAX: 12
      DB_POOL_MIN: 2
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:-BaiyeRedis2026!}"
      JWT_SECRET: "${JWT_SECRET:-baiye_prod_jwt_secret_please_change_ME_2026_v1_abcdef}"
      JWT_EXPIRES_IN: 7d
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:-baiye_prod_jwt_refresh_secret_please_change_ME_2026_v1}"
      JWT_REFRESH_EXPIRES_IN: 30d
      APP_NAME: "白夜"
      APP_DOMAIN: "${APP_DOMAIN:-http://zyb001.cn}"
      CORS_ORIGINS: "${CORS_ORIGINS:-*}"
    volumes:
      - server-uploads:/app/uploads
      - server-data:/app/data
      - server-logs:/app/logs
    expose:
      - "3000"
    networks: [back, front]
    healthcheck:
      test: ["CMD","sh","-c","wget -qO- http://127.0.0.1:3000/api/health 2>/dev/null | grep -q status"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: baiye-admin
    restart: always
    depends_on:
      - server
    expose:
      - "80"
    networks: [front]

  h5:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: baiye-h5
    restart: always
    depends_on:
      - server
    expose:
      - "80"
    networks: [front]

  gateway:
    image: nginx:1.27-alpine
    container_name: baiye-gateway
    restart: always
    depends_on:
      server:
        condition: service_healthy
      admin:
        condition: service_started
      h5:
        condition: service_started
    environment:
      TZ: Asia/Shanghai
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx-docker.conf:/etc/nginx/conf.d/default.conf:ro
      - gateway-logs:/var/log/nginx
    networks: [front]
    healthcheck:
      test: ["CMD","wget","-qO-","http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  mysql-data:
  redis-data:
  server-uploads:
  server-data:
  server-logs:
  gateway-logs:

networks:
  back:
    driver: bridge
  front:
    driver: bridge
