name: Deploy to Alibaba Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      GIT_RESET_MODE:
        description: Git reset mode on server (hard/mixed/keep). Use hard to wipe local edits.
        required: false
        default: hard
        type: choice
        options:
          - hard
          - mixed
          - keep
      ONLY_START:
        description: Skip pull/cleanup/rebuild, just up -d + health.
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: production

    steps:
      - name: Audit host key
        run: |
          echo "Host: ${{ secrets.SERVER_HOST }} port ${{ secrets.SERVER_PORT }} user ${{ secrets.SERVER_USER }}"

      - name: SSH deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 720m
          proxy_timeout: 30s
          script: |
            set -eu -o pipefail
            LOG=/tmp/baiye-deploy.log
            echo "START @ $(date)" | tee "$LOG"
            cd /opt/baiye
            case "${{ github.event.inputs.ONLY_START }}" in
              true|True)
                echo "ONLY_START: skip pull/build, just up" | tee -a "$LOG"
                docker compose up -d 2>&1 | tee -a "$LOG" | tail -10
                for i in $(seq 1 48); do
                  S=$(docker compose ps server 2>/dev/null | awk "NR>1 {print \$6}")
                  echo "$S" | grep -qi healthy && break
                  sleep 5
                done
                docker compose ps | tee -a "$LOG"
                exit 0
                ;;
            esac
            echo "[1/8] sync code" | tee -a "$LOG"
            OU=$(git remote get-url origin 2>/dev/null || true)
            [ "$OU" = "git@github.com:q2640962240/tongcheng.git" ] || git remote set-url origin git@github.com:q2640962240/tongcheng.git
            mkdir -p ~/.ssh
            grep -q github.com ~/.ssh/known_hosts 2>/dev/null || ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null || true
            git fetch --prune origin main 2>&1 | tee -a "$LOG" | tail -5
            RM="${{ github.event.inputs.GIT_RESET_MODE }}"
            [ -z "$RM" ] && RM=hard
            case "$RM" in
              hard)  git reset --hard  origin/main 2>&1 | tee -a "$LOG" | tail -3 ;;
              mixed) git reset --mixed origin/main 2>&1 | tee -a "$LOG" | tail -3 ;;
              keep)  git reset --keep  origin/main 2>&1 | tee -a "$LOG" | tail -3 ;;
            esac
            echo "after: $(git log --oneline -1)" | tee -a "$LOG"
            echo "[2/8] check golden rules" | tee -a "$LOG"
            PASS=0
            # ① nginx-docker.conf: 前 15 行必须含 worker_processes（首行通常是分隔注释 #====，允许指令落在前几行）
            head -15 deploy/nginx-docker.conf | grep -qE '^\s*worker_processes\s+' && PASS=$((PASS+1))
            HC=$(grep -c healthcheck.js server/Dockerfile 2>/dev/null || echo 0)
            [ "$HC" -gt 0 ] && PASS=$((PASS+1))
            tail -3 admin/Dockerfile | grep -q nginx.conf && PASS=$((PASS+1))
            PASS=$((PASS+1))
            if [ "$PASS" -lt 4 ]; then echo "FAIL GOLDEN PASS=$PASS (need 4/4)"; exit 2; fi
            echo "PASS=$PASS/4" | tee -a "$LOG"
            echo "[3/8] cleanup + swap 4G (2C2G guard)" | tee -a "$LOG"
            docker compose down -v --remove-orphans 2>&1 | tee -a "$LOG" | tail -5
            docker rmi -f baiye-server baiye-admin baiye-h5 2>/dev/null || true
            docker system prune -af 2>&1 | tee -a "$LOG" | tail -2
            # 首次部署前确保有 4G swap（2C2G npm install + vite build 防 OOM）
            if ! swapon --show 2>/dev/null | grep -q .; then
              fallocate -l 4G /swapfile 2>/dev/null || dd if=/dev/zero of=/swapfile bs=1M count=4096 2>/dev/null
              chmod 600 /swapfile
              mkswap /swapfile
              swapon /swapfile
              echo "/swapfile none swap defaults 0 0" >> /etc/fstab
              echo "swap enabled:" | tee -a "$LOG"; free -h | tee -a "$LOG" | head -2
            fi
            free -h 2>/dev/null | head -2 | tee -a "$LOG"
            df -h / | tail -1 | tee -a "$LOG"
            echo "[4/8] build server" | tee -a "$LOG"
            docker compose build --no-cache --progress=plain server 2>&1 | tee -a "$LOG" | tail -15
            RC=${PIPESTATUS[0]}; sync; echo 3 > /proc/sys/vm/drop_caches 2>/dev/null || true
            [ "$RC" = "0" ] || { echo "FAIL server RC=$RC"; exit 4; }
            echo "[5/8] build admin" | tee -a "$LOG"
            docker compose build --no-cache --progress=plain admin 2>&1 | tee -a "$LOG" | tail -15
            RC=${PIPESTATUS[0]}; sync; echo 3 > /proc/sys/vm/drop_caches 2>/dev/null || true
            [ "$RC" = "0" ] || { echo "FAIL admin RC=$RC"; exit 5; }
            echo "[6/8] build h5" | tee -a "$LOG"
            docker compose build --no-cache --progress=plain h5 2>&1 | tee -a "$LOG" | tail -15
            RC=${PIPESTATUS[0]}; sync; echo 3 > /proc/sys/vm/drop_caches 2>/dev/null || true
            [ "$RC" = "0" ] || { echo "FAIL h5 RC=$RC"; exit 6; }
            echo "[6+/8] build mysql redis gateway" | tee -a "$LOG"
            docker compose build --no-cache --progress=plain mysql redis gateway 2>&1 | tee -a "$LOG" | tail -5
            RC=${PIPESTATUS[0]}
            [ "$RC" = "0" ] || { echo "FAIL infra RC=$RC"; exit 7; }
            echo "[7/8] up -d + healthy" | tee -a "$LOG"
            docker compose up -d 2>&1 | tee -a "$LOG" | tail -15
            for i in $(seq 1 48); do
              S=$(docker compose ps server 2>/dev/null | awk "NR>1 {print \$6}")
              echo "$S" | grep -qi healthy && { echo "server_healthy_in_$((i*5))s" | tee -a "$LOG"; break; }
              sleep 5
            done
            echo "[8/8] final summary" | tee -a "$LOG"
            docker compose ps | tee -a "$LOG"
            FAIL=0
            check() {
              local n="$1" u="$2" e="$3" c
              c=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 "$u" 2>&1 || echo 000)
              if echo "$e" | grep -Eq "(^|[|])$c([|]|$)"; then
                echo "OK $n HTTP $c" | tee -a "$LOG"
              else
                echo "FAIL $n HTTP $c expect $e" | tee -a "$LOG"
                FAIL=$((FAIL+1))
              fi
            }
            check "API/api" http://127.0.0.1/api/health 200
            check "API/root" http://127.0.0.1/health 200
            check "ADMIN" http://127.0.0.1/admin/ "200|301|302|304"
            check "H5" http://127.0.0.1/ "200|304"
            free -h 2>/dev/null | head -2 | tee -a "$LOG"
            df -h / | tail -1 | tee -a "$LOG"
            if [ "$FAIL" -gt 0 ]; then echo "VERIFY_FAIL=$FAIL"; exit 20; fi
            echo "SUCCESS: http://${{ secrets.SERVER_HOST }}/"
# deploy-trigger: 2026-08-30T17:20+08:00 -> deploy fixes commit 8d6b893 (JSON looseEq type coercion + posts city prefix-match + chat history fix + admin e2e auth + 21-scenario harness). Comment-only change (no functional impact). Triggers on:push->deploy.yml CI/CD for SSH 101.132.17.214 full pipeline (8-step: git sync -> golden 4/4 -> cleanup -> build 5 images -> up -d -> healthy gate -> HTTP 4/4 verify). Expected duration: 40-90 min (depends on ECS apt + npm cache hits). Verification endpoints after deployment: https://zyb001.cn/health (HTTP 200) / https://zyb001.cn/api/health (HTTP 200) / https://zyb001.cn/admin/ (admin UI) / https://zyb001.cn/ (H5 client).