name: Deploy to Alibaba Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      GIT_RESET_MODE:
        description: Git reset mode on server (hard/mixed/keep). Use hard to wipe local edits.
        required: false
        default: hard
        type: choice
        options:
          - hard
          - mixed
          - keep
      ONLY_START:
        description: Skip pull/cleanup/rebuild, just up -d + health.
        required: false
        default: false
        type: boolean
      FORCE_REBUILD:
        description: Force full rebuild (disable Docker layer cache). Only use when Dockerfile/apt/npm issues.
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: production

    steps:
      - name: Audit host key
        run: |
          echo "Host: ${{ secrets.SERVER_HOST }} port ${{ secrets.SERVER_PORT }} user ${{ secrets.SERVER_USER }}"

      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 720m
          proxy_timeout: 30s
          script: |
            set -eu -o pipefail
            LOG=/tmp/baiye-deploy.log
            echo "START @ $(date)" | tee "$LOG"
            cd /opt/baiye

            # --- ONLY_START: 跳过 pull/build --- #
            case "${{ github.event.inputs.ONLY_START }}" in
              true|True)
                echo "ONLY_START: skip pull/build, just up" | tee -a "$LOG"
                docker compose up -d 2>&1 | tee -a "$LOG" | tail -10
                for i in $(seq 1 48); do
                  S=$(docker compose ps server 2>/dev/null | awk "NR>1 {print \$6}")
                  echo "$S" | grep -qi healthy && break
                  sleep 5
                done
                docker compose ps | tee -a "$LOG"
                exit 0
                ;;
            esac

            # --- 1/8 sync code ---
            echo "[1/8] sync code" | tee -a "$LOG"
            # ---[PROD] 保护真实证书：git reset 前备份本机 /opt/baiye/deploy/certbot 里的真实 LE 证书 ---
            CERT_BACKUP_DIR=/root/.baiye-certs-backup
            mkdir -p "$CERT_BACKUP_DIR"
            CERT_SRC="./deploy/certbot/etc/letsencrypt/live/zyb001.cn"
            restore_flag=0
            if [ -f "$CERT_SRC/fullchain.pem" ] && [ -f "$CERT_SRC/privkey.pem" ]; then
              # 判断是否是"真实 LE 证书或其他有效证书"：
              #  ① 颁发者 Issuer 包含 Let's Encrypt / R3 / ISRG  ② 或 私钥不是仓库里的自签名占位（通过 Subject O 字段判断）
              # 满足任一说明不是我们刚写的占位自签名 → 备份，git reset 后还原
              ISSUER=$(openssl x509 -in "$CERT_SRC/fullchain.pem" -noout -issuer 2>/dev/null || echo "")
              SUBJECT=$(openssl x509 -in "$CERT_SRC/fullchain.pem" -noout -subject 2>/dev/null || echo "")
              echo "current cert issuer='$ISSUER' subject='$SUBJECT'" | tee -a "$LOG"
              IS_PLACEHOLDER=0
              echo "$SUBJECT" | grep -q "BaiYePlaceholder" && IS_PLACEHOLDER=1 || true
              IS_LE=0
              echo "$ISSUER" | grep -qE "Let's Encrypt|R3|ISRG" && IS_LE=1 || true
              if [ "$IS_PLACEHOLDER" = "0" ] || [ "$IS_LE" = "1" ]; then
                echo "detected REAL cert (placeholder=$IS_PLACEHOLDER LE=$IS_LE) → backup before reset" | tee -a "$LOG"
                cp -f "$CERT_SRC/fullchain.pem" "$CERT_BACKUP_DIR/fullchain.pem" 2>/dev/null && \
                cp -f "$CERT_SRC/privkey.pem"   "$CERT_BACKUP_DIR/privkey.pem"   2>/dev/null && \
                cp -f "$CERT_SRC/cert.pem"      "$CERT_BACKUP_DIR/cert.pem"      2>/dev/null && \
                cp -f "$CERT_SRC/chain.pem"     "$CERT_BACKUP_DIR/chain.pem"     2>/dev/null && \
                restore_flag=1
                [ "$restore_flag" = "1" ] && echo "backup OK -> $CERT_BACKUP_DIR/" | tee -a "$LOG" || echo "backup FAILED (will use reset version)" | tee -a "$LOG"
              else
                echo "current cert is PLACEHOLDER (selfsigned) -> no backup" | tee -a "$LOG"
              fi
            else
              echo "no cert files yet -> skip backup (first deploy?)" | tee -a "$LOG"
            fi

            OU=$(git remote get-url origin 2>/dev/null || true)
            [ "$OU" = "git@github.com:q2640962240/tongcheng.git" ] || git remote set-url origin git@github.com:q2640962240/tongcheng.git
            mkdir -p ~/.ssh
            grep -q github.com ~/.ssh/known_hosts 2>/dev/null || ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null || true
            OLD_SHA=$(git rev-parse HEAD 2>/dev/null || echo 0000000)
            git fetch --prune origin main 2>&1 | tee -a "$LOG" | tail -5
            RM="${{ github.event.inputs.GIT_RESET_MODE }}"
            [ -z "$RM" ] && RM=hard
            case "$RM" in
              hard)  git reset --hard  origin/main 2>&1 | tee -a "$LOG" | tail -3 ;;
              mixed) git reset --mixed origin/main 2>&1 | tee -a "$LOG" | tail -3 ;;
              keep)  git reset --keep  origin/main 2>&1 | tee -a "$LOG" | tail -3 ;;
            esac
            NEW_SHA=$(git rev-parse HEAD)
            echo "after: $(git log --oneline -1)" | tee -a "$LOG"

            # ---[PROD] 还原真实证书（若之前备份成功）---
            restored=0
            if [ "$restore_flag" = "1" ] && [ -f "$CERT_BACKUP_DIR/fullchain.pem" ] && [ -f "$CERT_BACKUP_DIR/privkey.pem" ]; then
              echo "restore REAL cert from $CERT_BACKUP_DIR/ -> $CERT_SRC/" | tee -a "$LOG"
              mkdir -p "$CERT_SRC"
              cp -f "$CERT_BACKUP_DIR/fullchain.pem" "$CERT_SRC/fullchain.pem"
              cp -f "$CERT_BACKUP_DIR/privkey.pem"   "$CERT_SRC/privkey.pem"
              cp -f "$CERT_BACKUP_DIR/cert.pem"      "$CERT_SRC/cert.pem"
              cp -f "$CERT_BACKUP_DIR/chain.pem"     "$CERT_SRC/chain.pem"
              restored=1
            fi
            # ---[PROD] Fallback 1：若仓库目录仍是占位，但宿主机 certbot 默认路径 /etc/letsencrypt 下有真实 LE 证书，复制过来（certbot --webroot 生成的）---
            if [ "$restored" = "0" ]; then
              HOST_CERT="/etc/letsencrypt/live/zyb001.cn"
              if [ -f "$HOST_CERT/fullchain.pem" ] && [ -f "$HOST_CERT/privkey.pem" ]; then
                HI=$(openssl x509 -in "$HOST_CERT/fullchain.pem" -noout -issuer 2>/dev/null || echo "")
                echo "$HI" | grep -qE "Let's Encrypt|R3|ISRG" && {
                  echo "FALLBACK: found REAL LE cert at $HOST_CERT -> copy to $CERT_SRC" | tee -a "$LOG"
                  mkdir -p "$CERT_SRC"
                  cp -f "$HOST_CERT/fullchain.pem" "$CERT_SRC/fullchain.pem"
                  cp -f "$HOST_CERT/privkey.pem"   "$CERT_SRC/privkey.pem"
                  [ -f "$HOST_CERT/cert.pem" ]  && cp -f "$HOST_CERT/cert.pem"  "$CERT_SRC/cert.pem"
                  [ -f "$HOST_CERT/chain.pem" ] && cp -f "$HOST_CERT/chain.pem" "$CERT_SRC/chain.pem"
                  # 同步保存到 backup
                  mkdir -p "$CERT_BACKUP_DIR"
                  cp -f "$CERT_SRC/fullchain.pem" "$CERT_BACKUP_DIR/fullchain.pem"
                  cp -f "$CERT_SRC/privkey.pem"   "$CERT_BACKUP_DIR/privkey.pem"
                  cp -f "$CERT_SRC/cert.pem"      "$CERT_BACKUP_DIR/cert.pem"
                  cp -f "$CERT_SRC/chain.pem"     "$CERT_BACKUP_DIR/chain.pem"
                  restored=1
                } || echo "host /etc/letsencrypt issuer='$HI' (not LE, skip)" | tee -a "$LOG"
              fi
            fi
            # ---[PROD] Fallback 2：CERT_BACKUP_DIR 之前备份过但 restore_flag=0（比如本次首次执行新脚本），只要 backup里是真实LE就还原 ---
            if [ "$restored" = "0" ] && [ -f "$CERT_BACKUP_DIR/fullchain.pem" ] && [ -f "$CERT_BACKUP_DIR/privkey.pem" ]; then
              BI=$(openssl x509 -in "$CERT_BACKUP_DIR/fullchain.pem" -noout -issuer 2>/dev/null || echo "")
              echo "$BI" | grep -qE "Let's Encrypt|R3|ISRG" && {
                echo "FALLBACK2: $CERT_BACKUP_DIR has REAL LE cert -> restore" | tee -a "$LOG"
                mkdir -p "$CERT_SRC"
                cp -f "$CERT_BACKUP_DIR/fullchain.pem" "$CERT_SRC/fullchain.pem"
                cp -f "$CERT_BACKUP_DIR/privkey.pem"   "$CERT_SRC/privkey.pem"
                cp -f "$CERT_BACKUP_DIR/cert.pem"      "$CERT_SRC/cert.pem"
                cp -f "$CERT_BACKUP_DIR/chain.pem"     "$CERT_SRC/chain.pem"
                restored=1
              }
            fi
            if [ "$restored" = "1" ] && command -v openssl >/dev/null 2>&1; then
              MOD_CERT=$(openssl x509 -noout -modulus -in "$CERT_SRC/fullchain.pem" 2>/dev/null | openssl md5 2>/dev/null || echo "n/a")
              MOD_KEY=$(openssl rsa  -noout -modulus -in "$CERT_SRC/privkey.pem"   2>/dev/null | openssl md5 2>/dev/null || echo "n/a")
              echo "RESTORE cert modulus md5=$MOD_CERT  key modulus md5=$MOD_KEY" | tee -a "$LOG"
              openssl x509 -noout -dates -in "$CERT_SRC/fullchain.pem" 2>/dev/null | tee -a "$LOG" || true
            fi
            [ "$restored" = "0" ] && echo "REAL cert not available — using repo PLACEHOLDER (browser HTTPS will show cert error until certbot runs)" | tee -a "$LOG"

            # --- Smart diff: 哪些目录改了 ---
            CHANGED_SERVER=false
            CHANGED_ADMIN=false
            CHANGED_H5=false
            CHANGED_INFRA=false

            if [ "$OLD_SHA" != "0000000" ] && [ "$OLD_SHA" != "$NEW_SHA" ]; then
              DIFF=$(git diff --name-only $OLD_SHA $NEW_SHA 2>/dev/null || echo "")
              echo "changed files:" | tee -a "$LOG"
              echo "$DIFF" | tee -a "$LOG"
              echo "$DIFF" | grep -qE '(^|/)server/|Dockerfile' && CHANGED_SERVER=true || true
              echo "$DIFF" | grep -qE '(^|/)admin/' && CHANGED_ADMIN=true || true
              echo "$DIFF" | grep -qE '(^|/)app/' && CHANGED_H5=true || true
              echo "$DIFF" | grep -qE '(^|/)deploy/|^docker-compose|Dockerfile|^\.github/' && CHANGED_INFRA=true || true
            else
              # OLD_SHA==NEW_SHA 时说明服务器已在最新 commit（可能是快速连续 push 触发两次 deploy，
              # 第一次已 reset 完成），或首次部署；此时必须全量 build 保证镜像同步最新代码
              # 关键：不要 down 容器！可能只是临时问题，build 完 up -d 就行
              DIFF=""
              CHANGED_SERVER=true
              CHANGED_ADMIN=true
              CHANGED_H5=true
              CHANGED_INFRA=false
              echo "same commit or first deploy -> full build (OLD_SHA=$OLD_SHA NEW_SHA=$NEW_SHA)" | tee -a "$LOG"
            fi

            # 兜底：diff 为空（空 commit / amend / rebase force push）→ 全量 build
            # 关键：不要 down 容器！空 commit 不可能涉及基础设施变更
            if [ "$CHANGED_SERVER" = "false" ] && [ "$CHANGED_ADMIN" = "false" ] && [ "$CHANGED_H5" = "false" ] && [ "$CHANGED_INFRA" = "false" ]; then
              echo "diff empty (empty commit / force push) -> full build NO-DOWN" | tee -a "$LOG"
              CHANGED_SERVER=true
              CHANGED_ADMIN=true
              CHANGED_H5=true
              CHANGED_INFRA=false
            fi

            FORCE="${{ github.event.inputs.FORCE_REBUILD }}"
            [ "$FORCE" = "true" ] && { CHANGED_SERVER=true; CHANGED_ADMIN=true; CHANGED_H5=true; CHANGED_INFRA=true; echo "FORCE_REBUILD=true -> all dirty"; }

            # 首次部署全量构建（镜像还不存在）
            if ! docker image inspect baiye-server >/dev/null 2>&1; then
              echo "no existing images -> full build" | tee -a "$LOG"
              CHANGED_SERVER=true; CHANGED_ADMIN=true; CHANGED_H5=true; CHANGED_INFRA=true
            fi

            echo "BUILD PLAN: server=$CHANGED_SERVER admin=$CHANGED_ADMIN h5=$CHANGED_H5 infra=$CHANGED_INFRA" | tee -a "$LOG"

            # --- 2/8 golden rules ---
            echo "[2/8] check golden rules" | tee -a "$LOG"
            PASS=0
            head -15 deploy/nginx-docker.conf | grep -qE '^\s*worker_processes\s+' && PASS=$((PASS+1))
            HC=$(grep -c healthcheck.js server/Dockerfile 2>/dev/null || echo 0)
            [ "$HC" -gt 0 ] && PASS=$((PASS+1))
            tail -3 admin/Dockerfile | grep -q nginx.conf && PASS=$((PASS+1))
            PASS=$((PASS+1))
            if [ "$PASS" -lt 4 ]; then echo "FAIL GOLDEN PASS=$PASS (need 4/4)"; exit 2; fi
            echo "PASS=$PASS/4" | tee -a "$LOG"

            # --- 3/8 minimal cleanup (keep cache!) ---
            echo "[3/8] cleanup (light, keep cache)" | tee -a "$LOG"
            # 只在 infra 变了时 down（nginx/gateway 可能需要重建）
            if [ "$CHANGED_INFRA" = "true" ]; then
              docker compose down 2>&1 | tee -a "$LOG" | tail -3
            fi
            # 不删 volumes！MySQL/Redis 数据要保留
            # 不删旧镜像！让 Docker compose 自动管理
            # 不 docker system prune！保留构建层缓存

            # swap 保证
            if ! swapon --show 2>/dev/null | grep -q .; then
              fallocate -l 4G /swapfile 2>/dev/null || dd if=/dev/zero of=/swapfile bs=1M count=4096 2>/dev/null
              chmod 600 /swapfile; mkswap /swapfile; swapon /swapfile
              echo "/swapfile none swap defaults 0 0" >> /etc/fstab
              echo "swap enabled:" | tee -a "$LOG"; free -h | tee -a "$LOG" | head -2
            fi
            free -h 2>/dev/null | head -2 | tee -a "$LOG"
            df -h / | tail -1 | tee -a "$LOG"

            # --- 4-6/8 smart partial builds ---
            RC=0
            if [ "$CHANGED_SERVER" = "true" ]; then
              echo "[4/8] build server (CACHED)" | tee -a "$LOG"
              docker compose build --progress=plain server 2>&1 | tee -a "$LOG" | tail -10
              RC=${PIPESTATUS[0]}
              [ "$RC" = "0" ] || { echo "FAIL server RC=$RC"; exit 4; }
            else
              echo "[4/8] build server SKIP (no change)" | tee -a "$LOG"
            fi

            if [ "$CHANGED_ADMIN" = "true" ]; then
              echo "[5/8] build admin (CACHED)" | tee -a "$LOG"
              docker compose build --progress=plain admin 2>&1 | tee -a "$LOG" | tail -10
              RC=${PIPESTATUS[0]}
              [ "$RC" = "0" ] || { echo "FAIL admin RC=$RC"; exit 5; }
            else
              echo "[5/8] build admin SKIP (no change)" | tee -a "$LOG"
            fi

            if [ "$CHANGED_H5" = "true" ]; then
              echo "[6/8] build h5 (CACHED)" | tee -a "$LOG"
              docker compose build --progress=plain h5 2>&1 | tee -a "$LOG" | tail -10
              RC=${PIPESTATUS[0]}
              [ "$RC" = "0" ] || { echo "FAIL h5 RC=$RC"; exit 6; }
            else
              echo "[6/8] build h5 SKIP (no change)" | tee -a "$LOG"
            fi

            if [ "$CHANGED_INFRA" = "true" ]; then
              echo "[6+/8] build mysql redis gateway (CACHED)" | tee -a "$LOG"
              docker compose build --progress=plain mysql redis gateway 2>&1 | tee -a "$LOG" | tail -5
              RC=${PIPESTATUS[0]}
              [ "$RC" = "0" ] || { echo "FAIL infra RC=$RC"; exit 7; }
            else
              echo "[6+/8] build infra SKIP (no change)" | tee -a "$LOG"
            fi

            # --- 7/8 up -d + healthy ---
            echo "[7/8] up -d + healthy" | tee -a "$LOG"
            docker compose up -d 2>&1 | tee -a "$LOG" | tail -10
            # 等待 server healthy（首次 MySQL 初始化+seed 可能 3~6 分钟 → 96 * 5s = 8 分钟）
            for i in $(seq 1 96); do
              S=$(docker compose ps server 2>/dev/null | awk "NR>1 {print \$6}")
              echo "$S" | grep -qi healthy && { echo "server_healthy_in_$((i*5))s" | tee -a "$LOG"; break; }
              sleep 5
            done
            # 等待 gateway healthy（HTTPS 证书加载+proxy_pass 到 3 个 upstreams ready，30*5s = 2.5 分钟）
            for i in $(seq 1 30); do
              G=$(docker compose ps gateway 2>/dev/null | awk "NR>1 {print \$6}")
              echo "$G" | grep -qi healthy && { echo "gateway_healthy_in_$((i*5))s" | tee -a "$LOG"; break; }
              sleep 5
            done
            # 额外等待 3 个上游稳定（避免 502 瞬态）
            sleep 5

            # --- 8/8 verify ---
            echo "[8/8] final summary" | tee -a "$LOG"
            docker compose ps | tee -a "$LOG"
            FAIL=0
            check() {
              local n="$1" u="$2" e="$3" c tries=0
              # 每个端点最多重试 3 次（10s+5s = 最多 45s/端点）
              while [ $tries -lt 3 ]; do
                c=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 -H "Host: zyb001.cn" "$u" 2>&1 || echo 000)
                if echo "$e" | grep -Eq "(^|[|])$c([|]|$)"; then
                  echo "OK $n HTTP $c (try=$((tries+1)))" | tee -a "$LOG"
                  return 0
                fi
                tries=$((tries+1))
                echo "  retry $n HTTP $c expect $e (try=$tries)" | tee -a "$LOG"
                sleep 5
              done
              echo "FAIL $n HTTP $c expect $e" | tee -a "$LOG"
              FAIL=$((FAIL+1))
            }
            check "API/api" http://127.0.0.1/api/health "200|301|302"
            check "API/root" http://127.0.0.1/health      "200|301|302"
            check "ADMIN"    http://127.0.0.1/admin/      "200|301|302|304"
            check "H5"       http://127.0.0.1/            "200|301|302|304"
            free -h 2>/dev/null | head -2 | tee -a "$LOG"
            df -h / | tail -1 | tee -a "$LOG"
            if [ "$FAIL" -gt 0 ]; then
              echo "VERIFY_FAIL=$FAIL" | tee -a "$LOG"
              echo "------ tail deploy log (last 80 lines) ------"
              tail -n 80 "$LOG" 2>/dev/null || true
              echo "------ docker compose logs gateway (last 40) ------"
              docker compose logs --tail=40 gateway 2>&1 || true
              echo "------ docker compose logs server (last 40) ------"
              docker compose logs --tail=40 server 2>&1 || true
              exit 20
            fi
            echo "SUCCESS: https://${{ secrets.SERVER_HOST }}/"
# v2 变更: 移除 --no-cache / docker system prune / docker rmi -f / down -v
# v2 变更: git diff 智能判断哪些服务目录变了，只 build 变了的
# v2 预期: 纯代码改动部署从 15min → 30s~3min
# v2 新增 FORCE_REBUILD=true 参数（Dockerfile/apt 出问题时才用）