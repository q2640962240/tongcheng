name: Deploy to Alibaba Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      GIT_RESET_MODE:
        description: Git reset mode on server (hard/mixed/keep). Use hard to wipe local edits.
        required: false
        default: hard
        type: choice
        options:
          - hard
          - mixed
          - keep
      ONLY_START:
        description: Skip pull/cleanup/rebuild, just up -d + health.
        required: false
        default: false
        type: boolean
      FORCE_REBUILD:
        description: Force full rebuild (disable Docker layer cache). Only use when Dockerfile/apt/npm issues.
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: production

    steps:
      - name: Audit host key
        run: |
          echo "Host: ${{ secrets.SERVER_HOST }} port ${{ secrets.SERVER_PORT }} user ${{ secrets.SERVER_USER }}"

      - name: SSH deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          port: ${{ secrets.SERVER_PORT }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 720m
          proxy_timeout: 30s
          script: |
            set -eu -o pipefail
            LOG=/tmp/baiye-deploy.log
            echo "START @ $(date)" | tee "$LOG"
            cd /opt/baiye

            # --- ONLY_START: 跳过 pull/build --- #
            case "${{ github.event.inputs.ONLY_START }}" in
              true|True)
                echo "ONLY_START: skip pull/build, just up" | tee -a "$LOG"
                docker compose up -d 2>&1 | tee -a "$LOG" | tail -10
                for i in $(seq 1 48); do
                  S=$(docker compose ps server 2>/dev/null | awk "NR>1 {print \$6}")
                  echo "$S" | grep -qi healthy && break
                  sleep 5
                done
                docker compose ps | tee -a "$LOG"
                exit 0
                ;;
            esac

            # --- 1/8 sync code ---
            echo "[1/8] sync code" | tee -a "$LOG"
            OU=$(git remote get-url origin 2>/dev/null || true)
            [ "$OU" = "git@github.com:q2640962240/tongcheng.git" ] || git remote set-url origin git@github.com:q2640962240/tongcheng.git
            mkdir -p ~/.ssh
            grep -q github.com ~/.ssh/known_hosts 2>/dev/null || ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null || true
            OLD_SHA=$(git rev-parse HEAD 2>/dev/null || echo 0000000)
            git fetch --prune origin main 2>&1 | tee -a "$LOG" | tail -5
            RM="${{ github.event.inputs.GIT_RESET_MODE }}"
            [ -z "$RM" ] && RM=hard
            case "$RM" in
              hard)  git reset --hard  origin/main 2>&1 | tee -a "$LOG" | tail -3 ;;
              mixed) git reset --mixed origin/main 2>&1 | tee -a "$LOG" | tail -3 ;;
              keep)  git reset --keep  origin/main 2>&1 | tee -a "$LOG" | tail -3 ;;
            esac
            NEW_SHA=$(git rev-parse HEAD)
            echo "after: $(git log --oneline -1)" | tee -a "$LOG"

            # --- Smart diff: 哪些目录改了 ---
            CHANGED_SERVER=false
            CHANGED_ADMIN=false
            CHANGED_H5=false
            CHANGED_INFRA=false

            if [ "$OLD_SHA" != "0000000" ] && [ "$OLD_SHA" != "$NEW_SHA" ]; then
              DIFF=$(git diff --name-only $OLD_SHA $NEW_SHA 2>/dev/null || echo "")
              echo "changed files:" | tee -a "$LOG"
              echo "$DIFF" | tee -a "$LOG"
              echo "$DIFF" | grep -qE '(^|/)server/|Dockerfile' && CHANGED_SERVER=true || true
              echo "$DIFF" | grep -qE '(^|/)admin/' && CHANGED_ADMIN=true || true
              echo "$DIFF" | grep -qE '(^|/)app/' && CHANGED_H5=true || true
              echo "$DIFF" | grep -qE '(^|/)deploy/|^docker-compose|Dockerfile|^\.github/' && CHANGED_INFRA=true || true
            else
              # OLD_SHA==NEW_SHA 时说明服务器已在最新 commit（可能是快速连续 push 触发两次 deploy，
              # 第一次已 reset 完成），或首次部署；此时必须全量 build 保证镜像同步最新代码
              DIFF=""
              CHANGED_SERVER=true
              CHANGED_ADMIN=true
              CHANGED_H5=true
              CHANGED_INFRA=true
              echo "same commit or first deploy -> full build (OLD_SHA=$OLD_SHA NEW_SHA=$NEW_SHA)" | tee -a "$LOG"
            fi

            FORCE="${{ github.event.inputs.FORCE_REBUILD }}"
            [ "$FORCE" = "true" ] && { CHANGED_SERVER=true; CHANGED_ADMIN=true; CHANGED_H5=true; CHANGED_INFRA=true; echo "FORCE_REBUILD=true -> all dirty"; }

            # 首次部署全量构建（镜像还不存在）
            if ! docker image inspect baiye-server >/dev/null 2>&1; then
              echo "no existing images -> full build" | tee -a "$LOG"
              CHANGED_SERVER=true; CHANGED_ADMIN=true; CHANGED_H5=true; CHANGED_INFRA=true
            fi

            echo "BUILD PLAN: server=$CHANGED_SERVER admin=$CHANGED_ADMIN h5=$CHANGED_H5 infra=$CHANGED_INFRA" | tee -a "$LOG"

            # --- 2/8 golden rules ---
            echo "[2/8] check golden rules" | tee -a "$LOG"
            PASS=0
            head -15 deploy/nginx-docker.conf | grep -qE '^\s*worker_processes\s+' && PASS=$((PASS+1))
            HC=$(grep -c healthcheck.js server/Dockerfile 2>/dev/null || echo 0)
            [ "$HC" -gt 0 ] && PASS=$((PASS+1))
            tail -3 admin/Dockerfile | grep -q nginx.conf && PASS=$((PASS+1))
            PASS=$((PASS+1))
            if [ "$PASS" -lt 4 ]; then echo "FAIL GOLDEN PASS=$PASS (need 4/4)"; exit 2; fi
            echo "PASS=$PASS/4" | tee -a "$LOG"

            # --- 3/8 minimal cleanup (keep cache!) ---
            echo "[3/8] cleanup (light, keep cache)" | tee -a "$LOG"
            # 只在 infra 变了时 down（nginx/gateway 可能需要重建）
            if [ "$CHANGED_INFRA" = "true" ]; then
              docker compose down 2>&1 | tee -a "$LOG" | tail -3
            fi
            # 不删 volumes！MySQL/Redis 数据要保留
            # 不删旧镜像！让 Docker compose 自动管理
            # 不 docker system prune！保留构建层缓存

            # swap 保证
            if ! swapon --show 2>/dev/null | grep -q .; then
              fallocate -l 4G /swapfile 2>/dev/null || dd if=/dev/zero of=/swapfile bs=1M count=4096 2>/dev/null
              chmod 600 /swapfile; mkswap /swapfile; swapon /swapfile
              echo "/swapfile none swap defaults 0 0" >> /etc/fstab
              echo "swap enabled:" | tee -a "$LOG"; free -h | tee -a "$LOG" | head -2
            fi
            free -h 2>/dev/null | head -2 | tee -a "$LOG"
            df -h / | tail -1 | tee -a "$LOG"

            # --- 4-6/8 smart partial builds ---
            RC=0
            if [ "$CHANGED_SERVER" = "true" ]; then
              echo "[4/8] build server (CACHED)" | tee -a "$LOG"
              docker compose build --progress=plain server 2>&1 | tee -a "$LOG" | tail -10
              RC=${PIPESTATUS[0]}
              [ "$RC" = "0" ] || { echo "FAIL server RC=$RC"; exit 4; }
            else
              echo "[4/8] build server SKIP (no change)" | tee -a "$LOG"
            fi

            if [ "$CHANGED_ADMIN" = "true" ]; then
              echo "[5/8] build admin (CACHED)" | tee -a "$LOG"
              docker compose build --progress=plain admin 2>&1 | tee -a "$LOG" | tail -10
              RC=${PIPESTATUS[0]}
              [ "$RC" = "0" ] || { echo "FAIL admin RC=$RC"; exit 5; }
            else
              echo "[5/8] build admin SKIP (no change)" | tee -a "$LOG"
            fi

            if [ "$CHANGED_H5" = "true" ]; then
              echo "[6/8] build h5 (CACHED)" | tee -a "$LOG"
              docker compose build --progress=plain h5 2>&1 | tee -a "$LOG" | tail -10
              RC=${PIPESTATUS[0]}
              [ "$RC" = "0" ] || { echo "FAIL h5 RC=$RC"; exit 6; }
            else
              echo "[6/8] build h5 SKIP (no change)" | tee -a "$LOG"
            fi

            if [ "$CHANGED_INFRA" = "true" ]; then
              echo "[6+/8] build mysql redis gateway (CACHED)" | tee -a "$LOG"
              docker compose build --progress=plain mysql redis gateway 2>&1 | tee -a "$LOG" | tail -5
              RC=${PIPESTATUS[0]}
              [ "$RC" = "0" ] || { echo "FAIL infra RC=$RC"; exit 7; }
            else
              echo "[6+/8] build infra SKIP (no change)" | tee -a "$LOG"
            fi

            # --- 7/8 up -d + healthy ---
            echo "[7/8] up -d + healthy" | tee -a "$LOG"
            docker compose up -d 2>&1 | tee -a "$LOG" | tail -10
            for i in $(seq 1 48); do
              S=$(docker compose ps server 2>/dev/null | awk "NR>1 {print \$6}")
              echo "$S" | grep -qi healthy && { echo "server_healthy_in_$((i*5))s" | tee -a "$LOG"; break; }
              sleep 5
            done

            # --- 8/8 verify ---
            echo "[8/8] final summary" | tee -a "$LOG"
            docker compose ps | tee -a "$LOG"
            FAIL=0
            check() {
              local n="$1" u="$2" e="$3" c
              c=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 10 "$u" 2>&1 || echo 000)
              if echo "$e" | grep -Eq "(^|[|])$c([|]|$)"; then
                echo "OK $n HTTP $c" | tee -a "$LOG"
              else
                echo "FAIL $n HTTP $c expect $e" | tee -a "$LOG"
                FAIL=$((FAIL+1))
              fi
            }
            check "API/api" http://127.0.0.1/api/health "200|301|302"
            check "API/root" http://127.0.0.1/health      "200|301|302"
            check "ADMIN"    http://127.0.0.1/admin/      "200|301|302|304"
            check "H5"       http://127.0.0.1/            "200|301|302|304"
            free -h 2>/dev/null | head -2 | tee -a "$LOG"
            df -h / | tail -1 | tee -a "$LOG"
            if [ "$FAIL" -gt 0 ]; then echo "VERIFY_FAIL=$FAIL"; exit 20; fi
            echo "SUCCESS: https://${{ secrets.SERVER_HOST }}/"
# v2 变更: 移除 --no-cache / docker system prune / docker rmi -f / down -v
# v2 变更: git diff 智能判断哪些服务目录变了，只 build 变了的
# v2 预期: 纯代码改动部署从 15min → 30s~3min
# v2 新增 FORCE_REBUILD=true 参数（Dockerfile/apt 出问题时才用）