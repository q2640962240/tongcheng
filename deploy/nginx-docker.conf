# =====================================================================
# 白夜陪玩 · Nginx 网关（gateway 容器 · /etc/nginx/nginx.conf）
# 直接作为顶层 nginx.conf，包含 events {} + http {} 外层块。
# 结构：
#   HTTP  80 server  —— 仅处理 ACME webroot 挑战、健康检查 /health、
#                      其余一律 301 跳转到 HTTPS
#   HTTPS 443 server —— 承载所有业务路由（/api、/socket.io、/uploads、
#                      /admin、/dashboard、/ → h5）+ 安全响应头
# =====================================================================

worker_processes  auto;
pid               /var/run/nginx.pid;
error_log         /var/log/nginx/error.log warn;

events { worker_connections 2048; multi_accept on; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main buffer=16k flush=5s;

    sendfile on; tcp_nopush on; tcp_nodelay on;
    keepalive_timeout 65; server_tokens off;
    client_max_body_size 20m;

    gzip on; gzip_comp_level 6; gzip_min_length 1024; gzip_vary on; gzip_proxied any;
    gzip_types text/plain text/css text/javascript text/xml
               application/json application/javascript application/xml
               image/svg+xml font/woff2 application/font-woff2;

    # ---- SSL/TLS 全局（放在 http {} 内可被 443 server 继承，不要挪位置）----
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    # Docker 内置 DNS（127.0.0.11）解析 compose service 名（server/admin/h5）
    resolver 127.0.0.11 ipv6=off valid=30s;
    resolver_timeout 5s;

    # ---- upstreams ----
    upstream app_server { server server:3000 max_fails=3 fail_timeout=10s; keepalive 32; }
    upstream app_admin  { server admin:80   max_fails=2 fail_timeout=10s; keepalive 16; }
    upstream app_h5     { server h5:80      max_fails=2 fail_timeout=10s; keepalive 16; }

    # WebSocket Upgrade → Connection 映射
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # =====================================================================
    # HTTP 80  ·  ACME 挑战 + /health + 其余 301→HTTPS
    # =====================================================================
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name zyb001.cn www.zyb001.cn _;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type text/plain;
            try_files $uri =404;
        }

        location = /health {
            access_log off;
            proxy_pass         http://app_server/api/health;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   Connection        "";
            proxy_connect_timeout 3s;
            proxy_read_timeout  10s;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =====================================================================
    # HTTPS 443  ·  全部业务路由 + SSL + 安全头
    # =====================================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name zyb001.cn www.zyb001.cn _;
        charset utf-8;
        server_tokens off;

        # ---- 证书路径（与 docker-compose gateway volumes 严格对应）----
        ssl_certificate     /etc/letsencrypt/live/zyb001.cn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/zyb001.cn/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/zyb001.cn/chain.pem;
        ssl_stapling on;
        ssl_stapling_verify on;

        # ---- 安全响应头（always = 不论什么状态码都发）----
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        # ---- /health（healthcheck 走这里，不记日志，快速失败）----
        location = /health {
            access_log off;
            proxy_pass http://app_server/api/health;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   Connection        "";
            proxy_connect_timeout 3s;
            proxy_read_timeout  10s;
        }

        # ---- /api/（常规 REST，带缓冲）----
        location /api/ {
            proxy_pass http://app_server/api/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header Connection        "";
            proxy_read_timeout  300s;
            proxy_send_timeout  300s;
            proxy_connect_timeout 30s;
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 16 8k;
        }

        # ---- /socket.io/（WebSocket，必须长连接 + Upgrade 握手）----
        location /socket.io/ {
            proxy_pass http://app_server/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        "upgrade";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            proxy_connect_timeout 10s;
        }

        # ---- /uploads/（静态上传文件，7 天强缓存）----
        location /uploads/ {
            proxy_pass http://app_server/uploads/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        # ---- /admin/（管理后台 SPA，反代到 admin:80）----
        location /admin/ {
            proxy_pass http://app_admin/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header Connection        "";
        }
        location = /admin     { return 301 /admin/; }
        location = /dashboard { return 301 /dashboard/; }

        # ---- /dashboard/（和 /admin 同一个 admin SPA 容器）----
        location /dashboard/ {
            proxy_pass http://app_admin/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header Connection        "";
        }

        # ---- /（用户端 H5，走 h5:80）----
        location / {
            proxy_pass http://app_h5/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
        }

        # ---- 敏感路径兜底（禁止访问 dotfiles、源码锁文件、源码目录）----
        location ~* (^|/)\.(env|git|svn|ht|DS_Store|gitignore|idea|vscode) { deny all; access_log off; }
        location ~* (seed\.js|ecosystem\.config\.js|package-lock\.json|yarn\.lock|pnpm-lock\.yaml)$ { deny all; }
        location ~* /(data|logs|scripts|test|node_modules|\.github|\.trae|\.archcore)/ { deny all; }
    }
}
