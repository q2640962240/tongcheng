# =====================================================================
# 白夜陪玩 · Nginx 网关（gateway 容器 · /etc/nginx/nginx.conf）
# 直接作为顶层 nginx.conf，包含 events {} + http {} 外层块，避免 parser 上下文
# 错位引发 "unknown directive server"
# =====================================================================

worker_processes  auto;
pid               /var/run/nginx.pid;
error_log         /var/log/nginx/error.log warn;

events {
    worker_connections  2048;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main buffer=16k flush=5s;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens off;

    client_max_body_size 20m;
    client_body_timeout  30s;
    client_header_timeout 30s;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript text/xml
               application/json application/javascript application/xml
               image/svg+xml font/woff2 application/font-woff2;

    upstream app_server {
        server server:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }
    upstream app_admin {
        server admin:80 max_fails=2 fail_timeout=10s;
        keepalive 16;
    }
    upstream app_h5 {
        server h5:80 max_fails=2 fail_timeout=10s;
        keepalive 16;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        server_tokens off;
        charset utf-8;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/acme;
            default_type text/plain;
            try_files $uri =404;
        }

        location = /health {
            access_log off;
            proxy_pass         http://app_server/api/health;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   Connection        "";
            proxy_connect_timeout 3s;
            proxy_read_timeout  10s;
        }

        location /api/ {
            proxy_pass         http://app_server/api/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_connect_timeout 30s;
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 16 8k;
        }

        location /socket.io/ {
            proxy_pass         http://app_server/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 10s;
        }

        location /uploads/ {
            proxy_pass         http://app_server/uploads/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
        }

        location /admin/ {
            proxy_pass         http://app_admin/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
        }
        location = /admin {
            return 301 /admin/;
        }
        location /dashboard/ {
            proxy_pass         http://app_admin/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
        }
        location = /dashboard {
            return 301 /dashboard/;
        }

        location / {
            proxy_pass         http://app_h5/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";
        }

        location ~* (^|/)\.(env|git|svn|ht|DS_Store|gitignore|idea|vscode) { deny all; access_log off; }
        location ~* (seed\.js|ecosystem\.config\.js|package-lock\.json|yarn\.lock|pnpm-lock\.yaml)$ { deny all; }
        location ~* /(data|logs|scripts|test|node_modules|\.github|\.trae|\.archcore)/ { deny all; }
    }
}
