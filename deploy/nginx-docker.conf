server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    charset utf-8;
    client_max_body_size 20m;
    gzip on; gzip_comp_level 6; gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript text/xml application/json application/javascript application/xml image/svg+xml;
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; default_type text/plain; try_files $uri =404; }
    location = /health { proxy_pass http://server:3000/api/health; proxy_set_header Host $host; }
    location /api/ {
        proxy_pass         http://server:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 30s;
    }
    location /socket.io/ {
        proxy_pass         http://server:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location /uploads/ { proxy_pass http://server:3000/uploads/; expires 7d; }
    location /admin/     { proxy_pass http://admin:80/; proxy_set_header Host $host; }
    location = /admin    { return 301 /admin/; }
    location /dashboard/ { proxy_pass http://admin:80/; proxy_set_header Host $host; }
    location = /dashboard { return 301 /dashboard/; }
    location / { proxy_pass http://h5:80/; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location ~* (^|/)\.(env|git|svn|ht|DS_Store) { deny all; }
    location ~* (seed\.js|ecosystem\.config\.js|package-lock\.json)$ { deny all; }
    location ~* /(data|logs|scripts|test|node_modules)/ { deny all; }
}
