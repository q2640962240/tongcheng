# 白夜 · 宝塔面板 Nginx 站点模板（HTTPS 推荐）
# 域名: zyb001.cn
# ---------------------------------------------------------------------
# 使用方法（宝塔面板）：
# 1) 宝塔 → 网站 → 添加站点：
#      域名: zyb001.cn
#      根目录: /www/wwwroot/baiye
#      PHP 版本: 纯静态
#      数据库: 不创建（项目用独立 MySQL，在宝塔「数据库」页先建好 companion_play utf8mb4）
# 2) 宝塔 → 网站 → 对应域名 → 设置 → SSL → Let's Encrypt 一键申请（务必开启「强制 HTTPS」）
# 3) 宝塔 → 网站 → 对应域名 → 设置 → 配置文件 → 清空并粘贴本文件内容
# 4) 重启 Nginx（宝塔 → 软件 → Nginx → 重载配置）
# 5) 验证健康：curl -I https://zyb001.cn/health 应返回 200，body.driver=mysql

# ---------- HTTP → HTTPS 强制跳转 ----------
server {
    listen 80;
    listen [::]:80;
    server_name zyb001.cn;
    # Let's Encrypt 挑战路径保留，避免续期失败
    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/baiye;
        default_type text/plain;
    }
    return 301 https://$host$request_uri;
}

# ---------- HTTPS 主站点（API + 管理后台 静态 + 上传静态）----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name zyb001.cn;

    # --- SSL ---
    ssl_certificate     /www/server/panel/vhost/cert/zyb001.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/zyb001.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 统一入口：上传大小对齐 multer 限制
    client_max_body_size 20m;

    # 真实 IP 透传（PM2 cluster 下 req.ip 才会是用户 IP，用于短信/接口限流）
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    access_log /www/wwwlogs/zyb001.cn.log;
    error_log /www/wwwlogs/zyb001.cn.error.log;

    # A) 后端 API 反代（/api → PM2 :3000）
    location /api/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # 支付回调（微信/支付宝）容忍偶尔的慢响应
        proxy_connect_timeout 30s;
    }

    # B) 裸健康检查 /health（不挂 /api）
    location = /health {
        proxy_pass http://127.0.0.1:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # C) 上传文件静态直出（/uploads → server/uploads），交给 Nginx 比 Express 省 60%+ 吞吐
    # 若切换为阿里云 OSS 模式（OSS_PROVIDER=aliyun），本块可选保留作本地兜底
    location /uploads/ {
        alias /www/wwwroot/baiye/server/uploads/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        # 防盗链：可按需开启（仅本站 + 允许空 Referer）
        # valid_referers none blocked server_names;
        # if ($invalid_referer) { return 403; }
    }

    # D) Socket.IO IM（/socket.io → PM2 :3000，带 WebSocket 升级）
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # E) 管理后台（Vue 3 + Vite 构建产物，dist → admin/dist）
    #    如希望 admin 独立域名（admin.zyb001.cn），把本块搬到独立 server block，其余保持一致
    location /admin/ {
        alias /www/wwwroot/baiye/admin/dist/;
        try_files $uri $uri/ /admin/index.html;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
    location = /admin {
        return 301 /admin/;
    }

    # F) H5 站点（uni-app 输出 app/dist/build/h5，可选 — 若 H5 不托管可删掉）
    location /h5/ {
        alias /www/wwwroot/baiye/app/dist/build/h5/;
        try_files $uri $uri/ /h5/index.html;
        expires 7d;
    }

    # G) 根路径兜底：跳转到 H5 或 /admin/（按需选一种）
    #     方案 1: 跳 H5（推荐面向 C 端用户访问）
    location = / { return 302 /h5/; }
    #     方案 2: 跳管理后台（运营人员默认入口）
    # location = / { return 302 /admin/; }

    # H) 禁止访问敏感文件：.env / 日志 / 脚本 / 原始源码
    location ~* (^|/)\.(env|git|svn|ht|DS_Store) { deny all; }
    location ~* (ecosystem\.config\.js|seed\.js|pm2-.*\.log|package-lock\.json)$ { deny all; }
    location ~* /(data|logs|scripts|test|node_modules)/ { deny all; }
}

